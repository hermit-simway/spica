<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160" fill="none">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="bannerGlow" cx="120" cy="80" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Star Core Radiant Gradient -->
    <radialGradient id="starCore" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E0F2FE"/>
      <stop offset="80%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </radialGradient>

    <!-- Facet Gradients -->
    <linearGradient id="facetNorthL" x1="80" y1="20" x2="60" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="facetNorthR" x1="80" y1="20" x2="100" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="facetSouthL" x1="80" y1="140" x2="60" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="facetSouthR" x1="80" y1="140" x2="100" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="facetEastT" x1="140" y1="80" x2="80" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="facetEastB" x1="140" y1="80" x2="80" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="facetWestT" x1="20" y1="80" x2="80" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="facetWestB" x1="20" y1="80" x2="80" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="180" y1="50" x2="440" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="subTextGrad" x1="180" y1="110" x2="600" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Star -->
  <circle cx="80" cy="80" r="70" fill="url(#bannerGlow)"/>

  <!-- Icon Section (x: 80, y: 80, radius: 60) -->
  <g transform="translate(0, 0)">
    <!-- Diagonal Subtle Rays -->
    <g opacity="0.6">
      <polygon points="80,80 110,50 115,55 85,85" fill="#38BDF8" opacity="0.4"/>
      <polygon points="80,80 50,50 45,55 75,85" fill="#818CF8" opacity="0.4"/>
      <polygon points="80,80 110,110 115,105 85,75" fill="#818CF8" opacity="0.4"/>
      <polygon points="80,80 50,110 45,105 75,75" fill="#38BDF8" opacity="0.4"/>
    </g>

    <!-- Primary 4-Point Facets -->
    <polygon points="80,18 80,80 58,80" fill="url(#facetNorthL)"/>
    <polygon points="80,18 102,80 80,80" fill="url(#facetNorthR)"/>

    <polygon points="80,142 58,80 80,80" fill="url(#facetSouthL)"/>
    <polygon points="80,142 80,80 102,80" fill="url(#facetSouthR)"/>

    <polygon points="142,80 80,58 80,80" fill="url(#facetEastT)"/>
    <polygon points="142,80 80,80 80,102" fill="url(#facetEastB)"/>

    <polygon points="18,80 80,58 80,80" fill="url(#facetWestT)"/>
    <polygon points="18,80 80,80 80,102" fill="url(#facetWestB)"/>

    <!-- Inner Core Jewel -->
    <polygon points="80,52 104,80 80,108 56,80" fill="url(#starCore)" opacity="0.95"/>
    <polygon points="80,60 96,80 80,100 64,80" fill="#FFFFFF"/>
    <circle cx="80" cy="80" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Typography / Wordmark -->
  <!-- SPICA Title -->
  <text x="175" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="56" font-weight="800" letter-spacing="4" fill="url(#textGrad)">SPICA</text>

  <!-- Tagline / Subtitle -->
  <text x="178" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="500" letter-spacing="1" fill="#94A3B8">Open Domain Model &amp; Projection Toolchain for SDD</text>

  <!-- Version / Standard Pill Badge -->
  <g transform="translate(390, 48)">
    <rect width="96" height="24" rx="12" fill="#0F172A" stroke="url(#badgeGrad)" stroke-width="1.5"/>
    <text x="48" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#38BDF8" text-anchor="middle">OPEN ADM</text>
  </g>
</svg>